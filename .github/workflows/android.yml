name: Android CI

on:
  push:
    branches: [ main, 'agent/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Validate dictionary seed
        run: gradle :dict-builder:test :dict-builder:run --args='app/src/main/assets/dictionary/dictionary_seed.json'

      - name: Unit tests and debug APK
        run: gradle --stacktrace test assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TongshiHanzi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
