name: Package Namespace Migration

on:
  push:
    branches: [ agent/fix-package-namespace ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move sources and replace namespace
        run: python3 tools/migrate_package_namespace.py

      - name: Verify corrected namespace
        run: python3 tools/migrate_package_namespace.py --check

      - name: Commit migrated source tree
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No namespace migration changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: migrate Android package namespace [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
