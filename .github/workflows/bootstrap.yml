name: Bootstrap repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and expand project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/tongshi-project.tar.gz
          echo "b8448b1f27b95899dc19d5b46b87e4291d35374999a46d99a41d3566bff4a2be  /tmp/tongshi-project.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/tongshi-project.tar.gz > /dev/null
          tar -xzf /tmp/tongshi-project.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement initial TongshiHanzi Android application"
          git push
